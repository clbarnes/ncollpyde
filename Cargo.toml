[package]
name = "ncollpyde"
version = "0.19.0"
edition = "2018"

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }
parry3d-f64 = { version = "0.30.2", features = ["dim3", "f64"] }
rayon = "1.11"
rand = "0.9.2"
rand_pcg = "0.9.0"
numpy = "0.29.0"
# MUST be the same version used by numpy
ndarray = { version = "0.16.1", features = ["rayon"] }
log = "0.4.33"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.8.2"
stl_io = "0.11"

[lib]
name = "ncollpyde"
crate-type = ["cdylib"]

[package.metadata.release]
disable-publish = true
no-dev-version = true

[[bench]]
name = "containment"
harness = false
