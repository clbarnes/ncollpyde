[package]
name = "ncollpyde"
version = "0.19.0"
edition = "2018"

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
parry3d-f64 = { version = "0.25.3", features = ["dim3", "f64"] }
rayon = "1.11"
rand = "0.9.2"
rand_pcg = "0.9.0"
numpy = "0.29.0"
ndarray = { version = "0.16.1", features = ["rayon"] }

# ndarray is a dependency of numpy.
# There is currently no way to directly specify sub-dependency features;
# this addresses that.
# However, it raises a cargo warning and may be an error in future.
# At that point, we will need to rely directly on ndarray,
# ensuring that it is the same version as numpy uses.
# [dependencies.ndarray]
# features = ["rayon"]

[dev-dependencies]
stl_io = "0.10.0"

[lib]
name = "ncollpyde"
crate-type = ["cdylib"]

[package.metadata.release]
disable-publish = true
no-dev-version = true
